[package]
name = "tokenplan-shell"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Text renders menu-bar values with the system font instead of a bitmap font.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "signal"] }
tauri-plugin-global-shortcut = "2"
chrono = "0.4"


[dev-dependencies]
minisign-verify = "0.3"
base64 = "0.22"

# Rust's debug-info stripping can misalign Mach-O LINKEDIT with Xcode 27
# (rust-lang/rust#157750). Keep compile-time dylibs loadable without changing
# deployment targets or release optimization.
[profile.release]
strip = "none"
[profile.release.build-override]
strip = "none"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's AppIndicator adapter does not forward Linux left-click activation.
# SNI supplies Activate plus the standard right-click D-Bus menu.
ksni = "0.3.6"
# Detects a compositor before drawing transparent rounded corners (already a Tauri dependency).
gtk = "0.18"
# Already transitive; directly observe X11 button events without grabbing user input.
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
# A plain NSWindow cannot appear over another app's full-screen Space, so the menu-bar
# panel is converted to a non-activating NSPanel, as the native app uses. Pinned to the
# v2.1.1 tag's commit.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "ef6e3090a6083c653955ca0b6e7f6c6ae1453d40" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Direct result handling: the Tauri notification plugin discards desktop delivery failures.
notify-rust = "4"
