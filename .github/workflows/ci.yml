name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'updates/**'
      - 'README.md'
      - 'docs/**'
      - 'release/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded checks need not finish; release workflows have separate concurrency.
concurrency:
  group: tokenplan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/tauri-preview.yml
    with:
      source_ref: ${{ github.sha }}
      checks_only: true
