name: Tauri migration checks

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify; does not publish a release'
        type: string
        default: '0.0.0'
      checks_only:
        description: 'Run regression checks without signing or packaging'
        type: boolean
        default: false
      production:
        description: 'Verify production identity and native Mac transition signature'
        type: boolean
        default: false
      platforms:
        description: 'Platforms to verify (release workflows always default to all)'
        type: choice
        options: [all, windows-linux, linux]
        default: all
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      version:
        type: string
        default: '0.0.0'
      checks_only:
        type: boolean
        default: false
      production:
        type: boolean
        default: false
      platforms:
        type: string
        default: all

permissions:
  contents: read

jobs:
  interface:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'linux' && '[{"os":"ubuntu-22.04","platform":"linux","browser":"webkit"}]' || inputs.platforms == 'windows-linux' && '[{"os":"windows-latest","platform":"windows","browser":"chromium"},{"os":"ubuntu-22.04","platform":"linux","browser":"webkit"}]' || '[{"os":"macos-26","platform":"macos","browser":"webkit"},{"os":"windows-latest","platform":"windows","browser":"chromium"},{"os":"ubuntu-22.04","platform":"linux","browser":"webkit"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: platforms/tauri
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platforms/tauri/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify no UI cases were lost or duplicated
        if: runner.os == 'Linux'
        run: python3 ../../script/ci/check_ui_coverage.py
      - name: Use Ubuntu HTTPS package mirror
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' -o -name '*mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
      - name: Install the platform test engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify interface and platform layouts
        run: npm run test:release-ui -- --project='${{ matrix.platform }}-*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-${{ matrix.platform }}
          path: platforms/tauri/test-results-release/
          retention-days: 7
          if-no-files-found: warn

  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'linux' && '["ubuntu-22.04"]' || inputs.platforms == 'windows-linux' && '["windows-latest","ubuntu-22.04"]' || '["macos-26","windows-latest","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: platforms/tauri
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platforms/tauri/package-lock.json
      - uses: actions/setup-dotnet@v5
        if: runner.os != 'macOS'
        with:
          dotnet-version: 10.0.x
      - name: Use Ubuntu HTTPS package mirror
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' -o -name '*mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
      - name: Install Linux webview prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Select Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Identify compiler cache
        id: compiler
        shell: bash
        run: python3 ../../script/ci/compiler_cache_key.py
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            .build
            platforms/tauri/src-tauri/target/debug/deps
            platforms/tauri/src-tauri/target/debug/build
            platforms/tauri/src-tauri/target/debug/.fingerprint
          key: native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.toolchain }}-${{ hashFiles('platforms/tauri/src-tauri/Cargo.lock', 'Package.resolved', 'platforms/desktop/**/packages.lock.json') }}-${{ steps.compiler.outputs.source }}
          restore-keys: |
            native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.toolchain }}-${{ hashFiles('platforms/tauri/src-tauri/Cargo.lock', 'Package.resolved', 'platforms/desktop/**/packages.lock.json') }}-
      - run: npm ci
      - run: npm run build
      - run: python3 ../../script/test_tauri_migration_update.py
      - name: Native backend regression checks
        if: runner.os != 'macOS'
        run: |
          dotnet run --project ../desktop/TokenPlan.Core.Tests -c Release
          dotnet run --project ../desktop/TokenPlan.Bridge.Tests -c Release
      - name: Swift backend regression checks
        if: runner.os == 'macOS'
        run: swift test --package-path ../..
      - name: Add Intel Mac target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin --toolchain 1.90.0
      - name: Build native helper
        env:
          TOKENPLAN_UNIVERSAL: ${{ runner.os == 'macOS' && 'true' || 'false' }}
        run: npm run prepare:bridge
      - name: Build and test Tauri shell
        env:
          TOKENPLAN_NATIVE_TRAY_REVIEW: tray-native-review.png
        run: |
          # Restage fresh helper resources even after restoring build-script outputs.
          python3 -c "from pathlib import Path; Path('src-tauri/build.rs').touch()"
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native helper protocol smoke test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node scripts/smoke-bridge.mjs src-tauri/target/debug/tokenplan-bridge.exe
          else
            node scripts/smoke-bridge.mjs src-tauri/target/debug/tokenplan-bridge
          fi
      - name: Save reusable main cache before signing
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
            .build
            platforms/tauri/src-tauri/target/debug/deps
            platforms/tauri/src-tauri/target/debug/build
            platforms/tauri/src-tauri/target/debug/.fingerprint
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: apple-actions/import-codesign-certs@v7
        if: runner.os == 'macOS' && !inputs.checks_only
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Select Mac signing identity
        if: runner.os == 'macOS' && !inputs.checks_only
        shell: bash
        run: |
          identity=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign nested Swift framework helpers
        if: runner.os == 'macOS' && !inputs.checks_only
        shell: bash
        run: |
          # Tauri signs the framework itself; Sparkle's nested apps also need our
          # Developer ID, hardened runtime and secure timestamp before notarization.
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" src-tauri/binaries/Sparkle.framework
          codesign --verify --deep --strict src-tauri/binaries/Sparkle.framework
      - name: Package signed updater artifacts
        if: ${{ !inputs.checks_only }}
        shell: bash
        env:
          TOKENPLAN_VERSION: ${{ inputs.version || '0.0.0' }}
          TOKENPLAN_PRODUCTION: ${{ inputs.production && 'true' || 'false' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: H4982D35ZR
        run: |
          node scripts/package-config.mjs
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run tauri -- build --target universal-apple-darwin --config src-tauri/tauri.package.json
          else
            npm run tauri -- build --config src-tauri/tauri.package.json
          fi
      - name: Verify packaged updater signature
        if: ${{ !inputs.checks_only }}
        run: node scripts/verify-artifacts.mjs
      - name: Check Linux ABI baseline
        if: runner.os == 'Linux' && !inputs.checks_only
        run: python3 ../../script/ci/check_linux_abi.py src-tauri/target/release/bundle
      - name: Verify Linux DEB migration from legacy and 2.0.4 packages
        if: runner.os == 'Linux' && !inputs.checks_only && inputs.production
        shell: bash
        run: |
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          python3 ../../script/ci/check_linux_deb.py "$package"
      - name: Sign the native Mac migration feed
        if: runner.os == 'macOS' && !inputs.checks_only && inputs.production
        env:
          TOKENPLAN_VERSION: ${{ inputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 ../../script/sign_tauri_transition.py
      - name: Verify signed production helper can launch
        if: runner.os == 'macOS' && !inputs.checks_only && inputs.production
        run: |
          node scripts/smoke-bridge.mjs 'src-tauri/target/universal-apple-darwin/release/bundle/macos/TokenPlan.app/Contents/Helpers/TokenPlan Bridge.app/Contents/MacOS/tokenplan-bridge'
          node scripts/smoke-bridge.mjs 'src-tauri/target/universal-apple-darwin/release/bundle/macos/TokenPlan.app/Contents/Helpers/TokenPlan Bridge.app/Contents/MacOS/tokenplan-bridge' --production-defaults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.checks_only && 'native-checks' || 'tauri' }}-${{ runner.os }}
          path: |
            platforms/tauri/src-tauri/target/**/release/bundle/**/*.dmg
            platforms/tauri/src-tauri/target/**/release/bundle/**/*.app.tar.gz*
            platforms/tauri/src-tauri/target/**/release/bundle/**/*.exe*
            platforms/tauri/src-tauri/target/**/release/bundle/**/*.AppImage*
            platforms/tauri/src-tauri/target/**/release/bundle/**/*.deb
            platforms/tauri/transition/appcast.xml
            platforms/tauri/src-tauri/tray-native-review.png
          if-no-files-found: warn
      # Verification artifacts only. Published feeds require an approved stable version.

  linux-install:
    needs: build
    if: ${{ !inputs.checks_only && inputs.production }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tauri-Linux
          path: linux-packages
      - name: Use Ubuntu HTTPS package mirror
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' -o -name '*mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
      - name: Install graphical smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils imagemagick dbus-x11 binutils
      - name: Verify ABI, install, migrate and launch on target OS
        run: |
          python3 script/ci/check_linux_abi.py linux-packages
          package=$(find linux-packages -name '*.deb' -print -quit)
          python3 script/ci/check_linux_deb.py "$package"
          python3 script/ci/check_linux_launch.py linux-packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-launch-${{ matrix.os }}
          path: linux-smoke/
          if-no-files-found: warn
