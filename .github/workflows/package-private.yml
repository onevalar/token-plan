name: Private packages
# Build a pinned commit on main without creating a temporary branch.
run-name: Private package ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-package-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: check
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          git merge-base --is-ancestor "$COMMIT" origin/main
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: platforms/desktop/global.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - run: script/build_desktop.sh test
      - name: Build Windows and Linux installers
        env:
          VERSION: ${{ inputs.version }}
        run: script/build_desktop_installers.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installers
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
  native-tests:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: platforms/desktop/global.json
      - name: Install Linux interface fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Build and run core checks on target OS
        working-directory: platforms/desktop
        shell: bash
        run: |
          dotnet run --project TokenPlan.Core.Tests
          dotnet build TokenPlan.Desktop
          TOKENPLAN_UI_CAPTURE="$RUNNER_TEMP/tokenplan-ui" dotnet run --project TokenPlan.Desktop.Tests

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-checks-${{ matrix.os }}
          path: ${{ runner.temp }}/tokenplan-ui/*.png
          if-no-files-found: warn
          retention-days: 14
  installer-checks:
    needs: [validate, desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: desktop-installers
          path: ${{ runner.temp }}/installers
      - name: Install, upgrade, launch fixture and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/ci/check_windows_installer.ps1
      - name: Install, launch fixture and uninstall on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk "$RUNNER_TEMP"/installers/tokenplan_*_amd64.deb
          test -x /usr/bin/tokenplan
          test -f /opt/tokenplan/THIRD-PARTY-NOTICES.txt
          python3 script/verify_packaged_icon.py desktop /opt/tokenplan
          set +e
          xvfb-run -a timeout 12s /usr/bin/tokenplan --fixture > "$RUNNER_TEMP/installed-fixture.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/installed-fixture.log"
          test "$result" -eq 124
          sudo apt-get install -y --reinstall "$RUNNER_TEMP"/installers/tokenplan_*_amd64.deb
          sudo apt-get remove -y tokenplan
          test ! -e /opt/tokenplan/TokenPlan.Desktop
