name: Publish pricing supplement

on:
  push:
    branches: [main]
    paths:
      - Sources/OpenUsage/Resources/pricing_supplement.json
      - .github/workflows/pricing-supplement.yml
  workflow_dispatch:

concurrency:
  group: tokenplan-public-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate supplement JSON
        run: |
          python3 - << 'PY'
          import json, re, sys
          with open("Sources/OpenUsage/Resources/pricing_supplement.json") as f:
              supplement = json.load(f)
          problems = []
          for model, entry in supplement["pricing"].items():
              for field in ("input_per_million", "output_per_million"):
                  if not isinstance(entry.get(field), (int, float)):
                      problems.append(f"pricing[{model}].{field} missing or not a number")
          for rule in supplement["alias_rules"]:
              try:
                  re.compile(rule["pattern"])
              except re.error as error:
                  problems.append(f"alias pattern {rule['pattern']!r}: {error}")
              if not rule.get("canonical"):
                  problems.append(f"alias pattern {rule['pattern']!r} has no canonical")
          for model, multiplier in (supplement.get("fast_multipliers") or {}).items():
              if not isinstance(multiplier, (int, float)) or multiplier <= 0:
                  problems.append(f"fast_multipliers[{model}] must be a positive number")
          if problems:
              sys.exit("Supplement validation failed:\n" + "\n".join(problems))
          print(f"Supplement OK: {len(supplement['pricing'])} models, "
                f"{len(supplement['alias_rules'])} alias rules.")
          PY

      - name: Authorize public metadata publication
        id: app
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.APPS_APP_ID }}
          private-key: ${{ secrets.APPS_APP_PRIVATE_KEY }}
          owner: onevalar
          repositories: apps
          permission-contents: write
      - name: Publish pricing metadata to download repository main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh auth setup-git
          gh repo clone onevalar/apps "$RUNNER_TEMP/apps" -- --depth 1 --branch main
          mkdir -p "$RUNNER_TEMP/apps/tokenplan"
          cp Sources/OpenUsage/Resources/pricing_supplement.json "$RUNNER_TEMP/apps/tokenplan/pricing_supplement.json"
          cd "$RUNNER_TEMP/apps"
          git config user.name 'Onevalar Apps Publisher'
          git config user.email 'apps-publisher@users.noreply.github.com'
          git add tokenplan/pricing_supplement.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update TokenPlan pricing metadata'
            git push origin main
          fi
