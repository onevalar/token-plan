name: Publish TokenPlan
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Approved stable source tag; main is allowed for verification only'
        required: true
        type: string
      verify_only:
        description: 'Build, notarize and validate without publishing any release or feed'
        type: boolean
        default: false
      verification_version:
        description: 'Already approved version for a main-branch verification build'
        type: string
        default: '1.0.1'
permissions:
  contents: read
concurrency:
  group: tokenplan-public-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      tauri: ${{ steps.meta.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate publication metadata code
        run: python3 -m unittest discover -s script -p 'test_*update.py'
      - id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          VERIFY_VERSION: ${{ inputs.verification_version }}
        run: |
          if [[ "$VERIFY_ONLY" == 'true' && "$REQUESTED_TAG" == 'main' ]]; then
            [[ "$VERIFY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            version="$VERIFY_VERSION"
            source_ref=$(git rev-parse origin/main)
          else
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'An approved stable version tag is required'; exit 1; }
            source_ref=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
            git merge-base --is-ancestor "$source_ref" origin/main
            version="${REQUESTED_TAG#v}"
          fi
          git show "$source_ref:release/$version.md" > /tmp/notes
          test -s /tmp/notes
          if git cat-file -e "$source_ref:release/tauri-accepted" 2>/dev/null; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$source_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  mac:
    needs: validate
    if: needs.validate.outputs.tauri != 'true'
    runs-on: macos-26
    env:
      TOKENPLAN_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Require signing and notarization credentials
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_DEVELOPER_ID_ICLOUD_PROFILE }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          for key in CERT CERT_PASSWORD NOTARY_ID NOTARY_PASSWORD PROFILE SPARKLE_KEY; do
            test -n "${!key}" || { echo "::error::Missing cloud release credential: $key"; exit 1; }
          done
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Prepare signing profile and update configuration
        env:
          PROFILE: ${{ secrets.APPLE_DEVELOPER_ID_ICLOUD_PROFILE }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,time
          cfg=json.loads(pathlib.Path('release/update-config.json').read_text())
          profile=pathlib.Path(os.environ['RUNNER_TEMP'])/'tokenplan.provisionprofile'
          profile.write_bytes(base64.b64decode(os.environ['PROFILE']))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"ICLOUD_PROVISIONING_PROFILE={profile}\nSPARKLE_PUBLIC_KEY={cfg['sparkle_public_key']}\nFEED_URL={cfg['feed_url']}\nTOKENPLAN_BUILD={int(time.time())}\n")
          PY
          identity=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Test native app
        run: swift test
      - name: Build, sign and notarize
        env:
          DISABLE_UPDATES: '0'
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: H4982D35ZR
        run: script/release.sh
      - name: Verify and sign public update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TOKENPLAN_VERIFY_ONLY: ${{ inputs.verify_only }}
        run: python3 script/finalize_cloud_update.py
      - uses: actions/upload-artifact@v4
        with:
          name: tokenplan-mac-public
          path: |
            dist/cloud/*.dmg
            dist/cloud/appcast.xml
            dist/cloud/build.txt
          if-no-files-found: error
          retention-days: 7
  desktop:
    needs: validate
    if: needs.validate.outputs.tauri != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: platforms/desktop/global.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis libicu-dev fonts-noto-cjk
      - run: script/build_desktop.sh test
      - run: dotnet run --project platforms/desktop/TokenPlan.Desktop.Tests
      - name: Build Windows and Linux installers
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: script/build_desktop_installers.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: tokenplan-desktop-public
          path: |
            dist/installers/*.exe
            dist/installers/*.deb
          if-no-files-found: error
          retention-days: 7
  installer-tests:
    needs: [validate, desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: platforms/desktop/global.json
      - uses: actions/download-artifact@v4
        with:
          name: tokenplan-desktop-public
          path: ${{ runner.temp }}/installers
      - name: Install Linux UI fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test core logic and UI on the target OS
        shell: bash
        run: |
          dotnet run --project platforms/desktop/TokenPlan.Core.Tests
          dotnet run --project platforms/desktop/TokenPlan.Desktop.Tests
      - name: Install, upgrade, launch and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/ci/check_windows_installer.ps1
      - name: Install, launch and uninstall on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk "$RUNNER_TEMP"/installers/tokenplan_*_amd64.deb
          test -x /usr/bin/tokenplan
          test -f /opt/tokenplan/THIRD-PARTY-NOTICES.txt
          python3 script/verify_packaged_icon.py desktop /opt/tokenplan
          set +e
          xvfb-run -a timeout 12s /usr/bin/tokenplan --fixture > "$RUNNER_TEMP/installed-fixture.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/installed-fixture.log"
          test "$result" -eq 124
          sudo apt-get install -y --reinstall "$RUNNER_TEMP"/installers/tokenplan_*_amd64.deb
          sudo apt-get remove -y tokenplan
          test ! -e /opt/tokenplan/TokenPlan.Desktop
  publish:
    permissions:
      contents: write
    needs: [validate, mac, desktop, installer-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenplan-*-public
          merge-multiple: true
          path: dist/public
      - name: Publish installers and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          gh auth setup-git
          options=()
          if [[ "$VERIFY_ONLY" == 'true' ]]; then options+=(--prepare-only); fi
          python3 script/publish_update.py "$VERSION" --folder dist/public --build "$(cat dist/public/build.txt)" "${options[@]}"
          gh api repos/onevalar/token-plan --jq '{private, permissions}'

  tauri:
    permissions:
      contents: write
    needs: validate
    if: needs.validate.outputs.tauri == 'true' && inputs.verify_only != true
    uses: ./.github/workflows/tauri-release.yml
    with:
      tag: v${{ needs.validate.outputs.version }}
    secrets: inherit
  tauri-verification:
    needs: validate
    if: needs.validate.outputs.tauri == 'true' && inputs.verify_only == true
    uses: ./.github/workflows/tauri-preview.yml
    with:
      source_ref: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      production: true
    secrets: inherit
