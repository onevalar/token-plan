name: Ubuntu desktop interaction checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platforms/tauri/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install build and GNOME desktop prerequisites
        run: |
          # Avoid the slow Azure HTTP mirror; use Ubuntu's HTTPS archive on this disposable runner.
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf gnome-shell gnome-shell-extension-appindicator gnome-settings-daemon xvfb xdotool x11-utils imagemagick dbus-x11 python3-dbus python3-gi
      - run: rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: platforms/tauri/src-tauri
          key: desktop-${{ matrix.os }}
      - name: Compile test executable (no installers or release signing)
        working-directory: platforms/tauri
        run: |
          npm ci
          npm run build
          npm run prepare:bridge
          cargo +1.90.0 test --locked --manifest-path src-tauri/Cargo.toml
          cargo +1.90.0 build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - name: Exercise installed GNOME Shell and Ubuntu tray extension
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24 +extension GLX' dbus-run-session -- /usr/bin/python3 script/ci/check_linux_desktop.py platforms/tauri/src-tauri/target/debug/tokenplan-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: linux-desktop-evidence/
          if-no-files-found: warn
